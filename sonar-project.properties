# SonarQube Cloud - NeuroZen App Movil
# sonar.organization and sonar.projectKey are passed by the workflow
# from the repository variables SONAR_ORG and SONAR_PROJECT_KEY.

sonar.projectName=NeuroZen_AppMovil
sonar.sourceEncoding=UTF-8

sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java

# Reports generated by the "quality" job
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml

# Coverage: UI (Compose screens, navigation, theme), DI wiring and Android
# entry points are verified by instrumented tests or manually, not by JVM unit tests.
sonar.coverage.exclusions=\
  **/presentation/**/*Screen*.kt,\
  **/presentation/**/*Root.kt,\
  **/presentation/worker/WorkerNavHost.kt,\
  **/presentation/components/Components.kt,\
  **/presentation/components/DesignSystem.kt,\
  **/presentation/theme/**,\
  **/di/**,\
  **/notifications/**,\
  **/MainActivity.kt,\
  **/MyApplication.kt

# Fail the job if the Quality Gate fails
sonar.qualitygate.wait=true
